schema_version: "1.0.0"
id: "ghidra.credential-process-memory-dump"
name: "Credential Access via Process Memory Dumping"
namespace: "credential-access/process-dump"
scope: "file"
meta:
  rationale: "A process-dump API is a direct static capability indicator; the weaker privilege-adjustment path is retained only when process access is also present."
  references:
    - "https://attack.mitre.org/techniques/T1003/001/"
  att&ck: "T1003.001"
  mbc: "Credential Access::OS Credential Dumping [F0002]"
  weight: 40
  description: "Captures process memory dumps (e.g. LSASS) to extract credentials"
features:
  or:
    - api: "MiniDumpWriteDump"
    - and:
        - api: "OpenProcess"
        - or:
            - api: "LookupPrivilegeValueA"
            - api: "LookupPrivilegeValueW"
            - api: "AdjustTokenPrivileges"
