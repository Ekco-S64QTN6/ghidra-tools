name: Binary Analysis & CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-tests:
    name: Fast Python and CLI Regressions (No Ghidra)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25 for JSON escaping regression
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-rules.txt -r requirements-test.txt

      - name: Compile Python sources and tests
        run: python3 -m compileall -q scripts tests

      - name: Test Java JSON escaping against a real JSON parser
        run: python3 tests/test_report_format.py

      - name: Test versioned JSON report schema
        run: python3 tests/test_report_schema.py

      - name: Check canonical version consistency
        run: python3 tests/test_version_consistency.py

      - name: Test installed package layout and writable data paths
        run: python3 tests/test_package_layout.py

      - name: Test release archive includes the JSON schema contract
        run: |
          ./scripts/package_release.sh
          version="$(cat VERSION)"
          archive="dist/ghidra-report-v${version}-linux-x86_64.tar.gz"
          sha256sum -c "${archive}.sha256"
          tar -tzf "$archive" | grep -Fxq "ghidra-report/VERSION"
          tar -tzf "$archive" | grep -Fxq "ghidra-report/schemas/report-v1.schema.json"
          tar -tzf "$archive" | grep -Fxq "ghidra-report/requirements-test.txt"
          tar -tzf "$archive" | grep -Fxq "ghidra-report/requirements-rules.txt"

      - name: Test validated file and processor detection
        run: python3 tests/test_architecture_detector.py
      - name: Test ELF processor selection reaches Ghidra import
        run: bash tests/test_architecture_dispatch.sh

      - name: Test collision-resistant project identity
        run: python3 tests/test_project_identity.py

      - name: Smoke-test CLI help without a Ghidra install
        run: ./ghidra-report.sh --help >/dev/null

      - name: Test portable headless launcher
        run: bash tests/test_run_headless.sh

      - name: Test headless log exit-status preservation
        run: bash tests/test_headless_log.sh

      - name: Test Ghidra language availability helper
        run: bash tests/test_ghidra_language.sh

      - name: Test SNES raw-loader fallback behavior
        run: bash tests/test_snes_fallback.sh

      - name: Test report generation exit-status handling
        run: bash tests/test_report_generation.sh

      - name: Test atomic report-latest publication
        run: python3 tests/test_atomic_publish.py

      - name: Test same-output concurrency locking
        run: bash tests/test_output_lock.sh

      - name: Check shell script syntax
        run: bash -n ghidra-report.sh run-headless.sh scripts/headless_log.sh scripts/output_lock.sh scripts/ghidra_language.sh tests/test_headless_log.sh tests/test_ghidra_language.sh tests/test_snes_fallback.sh tests/test_architecture_dispatch.sh tests/test_report_generation.sh tests/test_output_lock.sh

      - name: Test batch failure propagation
        run: bash tests/test_batch_runner.sh

      - name: Test dashboard security and HTTP behavior
        run: python3 tests/test_dashboard_security.py

      - name: Test bounded firmware carving
        run: python3 tests/test_firmware_carver.py

      - name: Test trace correlator normalization
        run: python3 tests/test_trace_correlator.py

      - name: Test history indexer field mapping
        run: python3 tests/test_history_indexer.py

      - name: Test capability rule loading and operators
        run: python3 tests/test_capability_engine.py
  ghidra-container-smoke:
    name: Ghidra 12.2 Container Analysis Smoke (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build pinned Ghidra container
        run: docker build --pull -t ghidra-report-smoke .

      - name: Analyze synthetic PE with real Ghidra and validate artifacts
        run: |
          docker run --rm -i --entrypoint /bin/bash ghidra-report-smoke -s <<'CONTAINER'
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir"' EXIT
          python3 /workspace/tests/make_fixtures.py "$fixture_dir" >/dev/null
          /workspace/ghidra-report.sh --reimport "$fixture_dir/packed_sample.dll" --format all
          output_key="$(python3 /workspace/scripts/project_identity.py output "$fixture_dir/packed_sample.dll")"
          report_dir="/workspace/output/$output_key"
          for ext in txt json md html sarif yar misp.json; do
              test -s "$report_dir/report_latest.$ext" || {
                  echo "Missing or empty report_latest.$ext" >&2
                  exit 1
              }
          done
          python3 - "$report_dir" <<'PYTHON'
          import json
          import jsonschema
          import pathlib
          import sys

          reports = pathlib.Path(sys.argv[1])
          schema = json.loads(pathlib.Path("/workspace/schemas/report-v1.schema.json").read_text(encoding="utf-8"))
          report = json.loads((reports / "report_latest.json").read_text(encoding="utf-8"))
          jsonschema.validate(report, schema)
          assert report.get("schema_version") == "1.0.0", "report must declare schema_version 1.0.0"
          sarif = json.loads((reports / "report_latest.sarif").read_text(encoding="utf-8"))
          misp = json.loads((reports / "report_latest.misp.json").read_text(encoding="utf-8"))
          assert isinstance(report, dict), "analysis JSON must be an object"
          assert report.get("file"), "analysis JSON must identify the input file"
          assert sarif.get("version") == "2.1.0", "SARIF must declare version 2.1.0"
          assert isinstance(sarif.get("runs"), list) and sarif["runs"], "SARIF must contain a run"
          assert isinstance(misp.get("Event"), dict), "MISP export must contain an Event object"
          assert misp["Event"].get("Attribute"), "MISP export must contain attributes for the synthetic PE"
          print("PASS: Ghidra PE analysis produced all seven non-empty report formats with valid JSON/SARIF/MISP envelopes")
          PYTHON

          # SNES header/format detection is exercised by the full synthetic suite.
          # Raw 65816 analysis is conditional on an optional processor language extension.
          CONTAINER

      - name: Run full synthetic Ghidra-backed integration suite
        run: docker run --rm --entrypoint /bin/bash ghidra-report-smoke -s -c 'bash /workspace/tests/run_tests.sh'
