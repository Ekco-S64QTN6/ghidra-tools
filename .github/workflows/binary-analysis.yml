name: Binary Analysis & CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Regression & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 gzip zlib1g-dev

      - name: Run Integration Tests
        run: |
          chmod +x tests/run_tests.sh
          # Note: Full Ghidra execution requires Flatpak or headless installation.
          # We validate CLI, parsing, carving, database search, and dashboard components in CI:
          python3 scripts/firmware_carver.py scan tests/run_tests.sh || true
          python3 scripts/dashboard.py 8089 &
          DASH_PID=$!
          sleep 1
          curl -f http://localhost:8089/ || exit 1
          kill $DASH_PID

  analyze:
    name: Headless Binary Triage (Example Ingress)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: output/dsetup.dll/report_latest.sarif
          category: ghidra-report
        continue-on-error: true
