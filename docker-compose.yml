version: '3.8'

services:
  ghidra-report:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./ingress:/workspace/ingress
      - ./output:/workspace/output
      - ./projects:/workspace/projects
    environment:
      # Container-side wildcard bind requires the dashboard authentication token.
      - GHIDRA_DASHBOARD_HOST=0.0.0.0
      - GHIDRA_DASHBOARD_TOKEN=${GHIDRA_DASHBOARD_TOKEN:-}
    command: ["--dashboard", "8080"]
    restart: unless-stopped
