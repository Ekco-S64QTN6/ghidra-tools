version: '3.8'

services:
  ghidra-report:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./ingress:/workspace/ingress
      - ./output:/workspace/output
      - ./projects:/workspace/projects
    environment:
      # Container-side wildcard bind requires the dashboard authentication token.
      - GHIDRA_DASHBOARD_HOST=0.0.0.0
      - GHIDRA_DASHBOARD_TOKEN=${GHIDRA_DASHBOARD_TOKEN:-}
    command: ["--dashboard", "8080"]
    restart: unless-stopped

  dashboard-https:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      - DASHBOARD_DOMAIN=${DASHBOARD_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ghidra-report
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
